name: Validate QA (Scratch Org)

on:
  push:
    branches: [ qa ]
  pull_request:
    branches: [ qa ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ ✅ Install Salesforce CLI (modern way)
      - name: Install Salesforce CLI
        uses: salesforcecli/github-action@v2
        with:
          version: latest

      # 3️⃣ Authenticate to Dev Hub
      - name: Authenticate to Dev Hub
        run: |
          echo "${{ secrets.JWT_KEY }}" > assets/server.key
          sf org login jwt \
            --username ${{ secrets.SF_USERNAME }} \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --jwt-key-file assets/server.key \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias DevHub \
            --set-default-dev-hub

      # 4️⃣ Validate deployment in QA (Scratch Org)
      - name: Validate deployment in QA
        run: |
          sf project deploy validate \
            --target-org QAJJ \
            --test-level RunLocalTests \
            --verbose
