name: Validate QA (Scratch Org)

on:
  push:
    branches: [ qa ]
  pull_request:
    branches: [ qa ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Install Salesforce CLI correctly
      - name: Install Salesforce CLI
        uses: amtrack/sfdx-cli-action@v1

      - name: Authenticate to Dev Hub
        run: |
          echo "${{ secrets.JWT_KEY }}" > assets/server.key
          sfdx auth:jwt:grant \
            --username ${{ secrets.SF_USERNAME }} \
            --clientid ${{ secrets.CONSUMER_KEY }} \
            --jwtkeyfile assets/server.key \
            --instanceurl ${{ secrets.SF_INSTANCE_URL }} \
            -a DevHub

      - name: Set default org
        run: sfdx force:config:set defaultdevhubusername=DevHub

      - name: Validate deployment in QA
        run: |
          sfdx force:source:deploy -u QAJJ --checkonly --testlevel RunLocalTests --verbose
